name: Telegram Channel Watcher Bot

on:
  schedule:
    # All times are UTC (GitHub Actions standard), not local time
    - cron: '8 8 * * *'     # 08:08
    - cron: '9 9 * * *'     # 09:09
    - cron: '10 10 * * *'   # 10:10
    - cron: '11 11 * * *'   # 11:11
    - cron: '12 12 * * *'   # 12:12
    - cron: '13 13 * * *'   # 13:13
    - cron: '14 14 * * *'   # 14:14
    - cron: '15 15 * * *'   # 15:15
    - cron: '16 16 * * *'   # 16:16
    - cron: '17 17 * * *'   # 17:17
    - cron: '18 18 * * *'   # 18:18
    - cron: '19 19 * * *'   # 19:19
    - cron: '20 20 * * *'   # 20:20
    - cron: '21 21 * * *'   # 21:21
    - cron: '22 22 * * *'   # 22:22
    - cron: '23 23 * * *'   # 23:23
    - cron: '24 0 * * *'    # 00:24
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python check_channels.py 2>&1 | tee run_log.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run_log.txt

      - name: Commit updated state
        run: |
          git config user.name "channel-watcher-bot"
          git config user.email "actions@github.com"
          git add channels.json channel_keywords.json banned_words.json state.json bot_state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
