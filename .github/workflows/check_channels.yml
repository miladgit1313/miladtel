name: Check Telegram Channels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-channel-checker
  cancel-in-progress: false

jobs:
  check-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check Python syntax
        run: |
          echo "=========================================="
          echo "CHECK PYTHON SYNTAX"
          echo "=========================================="
          python --version
          python -m py_compile check_channels.py
          echo "[OK] Python syntax is valid."

      - name: Run channel checker
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          set -o pipefail

          echo "=========================================="
          echo "START CHANNEL CHECKER"
          echo "=========================================="

          python -u check_channels.py 2>&1 | tee channel_checker.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "=========================================="
          echo "CHANNEL CHECKER EXIT CODE: ${EXIT_CODE}"
          echo "=========================================="

          exit ${EXIT_CODE}

      - name: Save state files
        if: always()
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SAVE STATE FILES"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "[INFO] Current branch:"
          git branch --show-current

          echo "[INFO] Git status before add:"
          git status --short

          echo "[INFO] Adding state files..."

          git add channels.json state.json bot_state.json channel_checker.log

          echo "[INFO] Git status after add:"
          git status --short

          if git diff --cached --quiet; then
            echo "[INFO] No state changes to commit."
            exit 0
          fi

          echo "[INFO] Creating commit..."
          git commit -m "Update bot state"

          echo "[INFO] Pushing changes..."

          if git push; then
            echo "[OK] State files pushed successfully."
          else
            echo "[ERROR] git push failed."
            echo "[INFO] Fetching latest repository state..."

            git fetch origin

            BRANCH="$(git branch --show-current)"

            if [ -z "${BRANCH}" ]; then
              echo "[ERROR] Could not determine current branch."
              exit 1
            fi

            echo "[INFO] Current branch: ${BRANCH}"
            echo "[INFO] Attempting rebase..."

            git rebase "origin/${BRANCH}"

            echo "[INFO] Retrying push..."
            git push

            echo "[OK] State files pushed after rebase."
          fi
