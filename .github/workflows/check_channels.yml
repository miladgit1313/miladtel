name: Telegram Channel Watcher Bot

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "15 5 * * *"
    - cron: "0 6 * * *"
    - cron: "45 6 * * *"
    - cron: "30 7 * * *"
    - cron: "15 8 * * *"
    - cron: "0 9 * * *"
    - cron: "45 9 * * *"
    - cron: "30 10 * * *"
    - cron: "15 11 * * *"
    - cron: "0 12 * * *"
    - cron: "45 12 * * *"
    - cron: "30 13 * * *"
    - cron: "15 14 * * *"
    - cron: "0 15 * * *"
    - cron: "45 15 * * *"
    - cron: "30 16 * * *"
    - cron: "15 17 * * *"
    - cron: "0 18 * * *"
    - cron: "45 18 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python check_channels.py 2>&1 | tee run_log.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run_log.txt

      - name: Commit updated state
        run: |
          git config user.name "channel-watcher-bot"
          git config user.email "actions@github.com"
          git add channels.json channel_keywords.json banned_words.json state.json bot_state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
