name: Telegram Channel Watcher Bot

on:
  schedule:
    # All times are UTC (GitHub Actions standard).
    # Local time (Tehran, UTC+3:30) shown in comments.
    - cron: '0 5 * * *'       # 08:30 Tehran -> 05:00 UTC
    - cron: '5 7 * * *'       # 10:35 Tehran -> 07:05 UTC
    - cron: '40 8 * * *'      # 12:10 Tehran -> 08:40 UTC
    - cron: '50 9 * * *'      # 13:20 Tehran -> 09:50 UTC
    - cron: '45 10 * * *'     # 14:15 Tehran -> 10:45 UTC
    - cron: '0 13 * * *'      # 16:30 Tehran -> 13:00 UTC
    - cron: '39 15 * * *'     # 19:09 Tehran -> 15:39 UTC
    - cron: '20 17 * * *'     # 20:50 Tehran -> 17:20 UTC
    - cron: '47 18 * * *'     # 22:17 Tehran -> 18:47 UTC
    - cron: '50 19 * * *'     # 23:20 Tehran -> 19:50 UTC
    - cron: '43 20 * * *'     # 00:13 Tehran -> 20:43 UTC (previous day)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: telegram-channel-watcher
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python check_channels.py 2>&1 | tee run_log.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run_log.txt

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "channel-watcher-bot"
          git config user.email "actions@github.com"
          git add channels.json channel_keywords.json banned_words.json state.json bot_state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
